<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Form - StockFlow Inventory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/database.js"></script>
    <script>checkAuthRedirect();</script>
    <script src="js/supplier-form.js" defer></script>
  </head>
  <body>
    <nav class="nav">
      <h1><a href="products.html">StockFlow</a></h1>
      <ul class="links">
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="product-form.html">Add Product</a></li>
        <li><a class="link" href="suppliers.html">Suppliers</a></li>
        <li><a class="link active" href="supplier-form.html">Add Supplier</a></li>
        <li><a class="link" href="index.html">Log Out</a></li>
      </ul>
    </nav>
    <div class="container small">
      <div class="card">
        <h2>Add New Supplier</h2>
        <p class="desc">
          Please enter the supplier details below.
        </p>

        <form action="suppliers.html" method="GET">
          <div class="group">
            <label for="name">
              Supplier Name <span class="required">*</span>
            </label>
            <input
              class="input"
              type="text"
              id="name"
              name="supplierName"
              placeholder="Enter company or supplier name"
              required
            />
          </div>

          <div class="group">
            <label for="email">
              Contact Email <span class="required">*</span>
            </label>
            <input
              class="input"
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="group">
            <label for="phone">
              Phone Number <span class="required">*</span>
            </label>
            <input
              class="input"
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter phone number"
              required
            />
          </div>

          <div class="group">
            <label for="notes">Notes (Optional)</label>
            <textarea
              class="input"
              id="notes"
              name="notes"
              placeholder="Enter optional delivery or payment terms"
              rows="4"
            ></textarea>
          </div>

          <div class="footer">
            <button type="submit" class="btn primary">Save Supplier</button>
            <a href="suppliers.html" class="btn secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
