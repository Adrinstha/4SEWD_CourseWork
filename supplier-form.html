<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Form - StockFlow Inventory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1><a href="products.html">StockFlow</a></h1>
      <ul class="nav-links">
        <li><a class="nav-link" href="products.html">Products</a></li>
        <li><a class="nav-link" href="product-form.html">Add Product</a></li>
        <li><a class="nav-link" href="suppliers.html">Suppliers</a></li>
        <li><a class="nav-link active" href="supplier-form.html">Add Supplier</a></li>
        <li><a class="nav-link" href="index.html">Log Out</a></li>
      </ul>
    </nav>
    <div class="container container-sm">
      <div class="form-card">
        <h2>Add New Supplier</h2>
        <p class="text-muted-desc">
          Please enter the supplier details below.
        </p>

        <form action="suppliers.html" method="GET">
          <div class="form-group">
            <label for="supplier-name">
              Supplier Name <span class="required">*</span>
            </label>
            <input
              class="form-control"
              type="text"
              id="supplier-name"
              name="supplierName"
              placeholder="Enter company or supplier name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">
              Contact Email <span class="required">*</span>
            </label>
            <input
              class="form-control"
              type="email"
              id="email"
              name="email"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">
              Phone Number <span class="required">*</span>
            </label>
            <input
              class="form-control"
              type="tel"
              id="phone"
              name="phone"
              placeholder="Enter phone number"
              required
            />
          </div>

          <div class="form-group">
            <label for="notes">Notes (Optional)</label>
            <textarea
              class="form-control"
              id="notes"
              name="notes"
              placeholder="Enter optional delivery or payment terms"
              rows="4"
            ></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Supplier</button>
            <a href="suppliers.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
