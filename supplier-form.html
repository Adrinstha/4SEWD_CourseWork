<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supplier Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1>StockFlow Inventory</h1>
      <ul class="nav-links">
        <li><a href="products.html">Products</a></li>
        <li><a href="product-form.html">Add Product</a></li>
        <li><a href="suppliers.html">Suppliers</a></li>
        <li><a href="supplier-form.html">Add Supplier</a></li>
        <li><a href="index.html">Log Out</a></li>
      </ul>
    </nav>
    <div class="container" style="max-width: 600px">
      <h2>Add New Supplier</h2>
      <p>Please enter the supplier details below.</p>

      <form action="suppliers.html" method="GET">
        <div class="form-group">
          <label for="supplier-name"
            >Supplier Name <span class="required">*</span></label
          >
          <input
            class="form-control"
            type="text"
            id="supplier-name"
            name="supplierName"
            placeholder="Enter company or supplier name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email"
            >Contact Email <span class="required">*</span></label
          >
          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            placeholder="name@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone"
            >Phone Number <span class="required">*</span></label
          >
          <input
            class="form-control"
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter phone number"
            required
          />
        </div>

        <div class="form-group">
          <label for="notes">Notes (Optional)</label>
          <textarea
            class="form-control"
            id="notes"
            name="notes"
            placeholder="Enter optional delivery or payment terms"
            rows="4"
          ></textarea>
        </div>

        <div style="margin-top: 20px">
          <button type="submit" class="btn btn-primary">Save Supplier</button>
          <a href="suppliers.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
