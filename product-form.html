<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1>StockFlow Inventory</h1>
      <ul class="nav-links">
        <li><a href="products.html">Products</a></li>
        <li><a href="product-form.html">Add Product</a></li>
        <li><a href="suppliers.html">Suppliers</a></li>
        <li><a href="supplier-form.html">Add Supplier</a></li>
        <li><a href="index.html">Log Out</a></li>
      </ul>
    </nav>
    <div class="container" style="max-width: 600px">
      <h2>Add New Product</h2>
      <p>Please fill out the details below to add a product record.</p>

      <form action="products.html" method="GET" enctype="multipart/form-data">
        <div class="form-group">
          <label for="product-name"
            >Product Name <span class="required">*</span></label
          >
          <input
            class="form-control"
            type="text"
            id="product-name"
            name="productName"
            placeholder="Enter product name"
            required
          />
        </div>

        <div class="form-group">
          <label for="description"
            >Description <span class="required">*</span></label
          >
          <textarea
            class="form-control"
            id="description"
            name="description"
            placeholder="Enter product description"
            rows="4"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="price">Price ($) <span class="required">*</span></label>
          <input
            class="form-control"
            type="number"
            id="price"
            name="price"
            min="0"
            step="0.01"
            placeholder="0.00"
            required
          />
        </div>

        <div class="form-group">
          <label for="quantity">Quantity <span class="required">*</span></label>
          <input
            class="form-control"
            type="number"
            id="quantity"
            name="quantity"
            min="0"
            step="1"
            placeholder="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="supplier">Supplier <span class="required">*</span></label>
          <select class="form-control" id="supplier" name="supplier" required>
            <option value="">Select a supplier</option>
            <option>TechSource Nepal</option>
            <option>Office Hub</option>
            <option>Digital Traders</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product-image"
            >Product Image <span class="required">*</span></label
          >
          <input
            type="file"
            id="product-image"
            name="productImage"
            accept="image/*"
            required
          />
        </div>

        <div>
          <button type="submit" class="btn btn-primary">Save Product</button>
          <a href="products.html" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </body>
</html>
