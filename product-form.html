<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Form - StockFlow Inventory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="nav">
      <h1><a href="products.html">StockFlow</a></h1>
      <ul class="links">
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link active" href="product-form.html">Add Product</a></li>
        <li><a class="link" href="suppliers.html">Suppliers</a></li>
        <li><a class="link" href="supplier-form.html">Add Supplier</a></li>
        <li><a class="link" href="index.html">Log Out</a></li>
      </ul>
    </nav>
    <div class="container small">
      <div class="card">
        <h2>Add New Product</h2>
        <p class="desc">
          Please fill out the details below to add a product record.
        </p>

        <form action="products.html" method="GET" enctype="multipart/form-data">
          <div class="group">
            <label for="name">
              Product Name <span class="required">*</span>
            </label>
            <input
              class="input"
              type="text"
              id="name"
              name="productName"
              placeholder="Enter product name"
              required
            />
          </div>

          <div class="group">
            <label for="description">
              Description <span class="required">*</span>
            </label>
            <textarea
              class="input"
              id="description"
              name="description"
              placeholder="Enter product description"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="group row">
            <div>
              <label for="price">Price ($) <span class="required">*</span></label>
              <input
                class="input"
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                placeholder="0.00"
                required
              />
            </div>
            <div>
              <label for="quantity">Quantity <span class="required">*</span></label>
              <input
                class="input"
                type="number"
                id="quantity"
                name="quantity"
                min="0"
                step="1"
                placeholder="0"
                required
              />
            </div>
          </div>

          <div class="group">
            <label for="supplier">Supplier <span class="required">*</span></label>
            <select class="input" id="supplier" name="supplier" required>
              <option value="">Select a supplier</option>
              <option>TechSource Nepal</option>
              <option>Office Hub</option>
              <option>Digital Traders</option>
            </select>
          </div>

          <div class="group">
            <label>Product Image <span class="required">*</span></label>
            <div class="uploader">
              <div class="label">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                </svg>
                <span><strong>Click to upload</strong> or drag and drop</span>
                <span style="font-size: 0.75rem;">PNG, JPG or SVG (max. 2MB)</span>
              </div>
              <input
                type="file"
                id="image"
                name="productImage"
                accept="image/*"
                required
              />
            </div>
            <div class="preview">
              <div class="thumb empty">
                No file
              </div>
              <span class="filename">Preview will show here</span>
            </div>
          </div>

          <div class="footer">
            <button type="submit" class="btn primary">Save Product</button>
            <a href="products.html" class="btn secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
