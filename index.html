<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - StockFlow Inventory</title>
    <link rel="stylesheet" href="style.css" />
    <script src="js/database.js" defer></script>
    <script src="js/login.js" defer></script>
  </head>
  <body>
    <div class="login">
      <form class="panel" action="products.html" method="GET">
        <h1>StockFlow</h1>
        <p>Sign in to access your inventory dashboard</p>

        <div class="group">
          <label for="email">
            Email Address <span class="required">*</span>
          </label>
          <input
            class="input"
            type="email"
            id="email"
            name="email"
            placeholder="admin@example.com" 
            value="adrinshrestha16@gmail.com"
            required
          />
        </div>

        <div class="group">
          <label for="password">
            Password <span class="required">*</span>
          </label>
          <input
            class="input"
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="group">
          <label class="checkbox">
            <input type="checkbox" name="remember" /> Remember me
          </label>
        </div>

        <button class="btn primary" type="submit">
          Login
        </button>
      </form>
    </div>
  </body>
</html>
